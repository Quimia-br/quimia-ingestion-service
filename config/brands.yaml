# Marcas de outros fabricantes que aparecem nas buscas de imagem. Um candidato que cite uma delas
# (ex.: "Downy Brisa Suave", "Urca Brisa Azul") é rejeitado, mesmo que contenha o nome da nossa marca.
# Só entram nomes que não são palavras comuns; amplie conforme aparecerem falsos positivos.
other_brands:
  - downy
  - urca
  - comfort
  - ypê
  - ariel
  - ala
  - surf
  - tixan
  - lysoform
  - pinho sol
  - qboa
  - sanol
  - bombril
  - limpol

