[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quimia-ingestion-service"
version = "0.2.0"
description = "Serviço independente para ingestão de FDS e enriquecimento de imagens do Quimia."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
images = ["rembg[cpu]>=2.0.67,<3"]
dev = ["pytest>=8,<10"]
all = ["psycopg[binary]>=3.2,<4", "rembg[cpu]>=2.0.67,<3", "pytest>=8,<10"]

[project.scripts]
quimia-ingestion = "quimia_ingestion.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
